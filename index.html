<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Haku</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="logo">
            <span class="g">G</span><span class="o1">o</span><span class="o2">o</span><span class="g2">g</span><span class="l">l</span><span class="e">e</span>
        </div>
        
        <form action="https://www.google.com/search" method="GET">
            <input type="text" name="q" class="search-box" placeholder="Hae Googlesta..." autofocus>
            <div class="buttons">
                <button type="submit" class="btn">Google Haku</button>
                <button type="button" class="btn" onclick="luckySearch()">Onnekas hetki</button>
            </div>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
